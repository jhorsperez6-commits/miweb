        .key-box { background-color: #1a1c23; border: 1px dashed #00bfff; padding: 20px; border-radius: 10px; margin-top: 15px; margin-bottom: 20px; }
        .key-text { color: #00ff88; font-family: monospace; font-size: 17px; font-weight: bold; word-break: break-all; background: #0b0c10; padding: 12px; border-radius: 6px; border: 1px solid #333; }
        .btn { background: linear-gradient(135deg, #00cc66, #00994d); color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 204, 102, 0.3); transition: transform 0.2s; }
        .btn:active { transform: scale(0.98); }
        .info { font-size: 12px; color: #8c91a0; margin-top: 15px; }
    </style>

        window.onload = function() {
            const savedKey = localStorage.getItem("sph_user_assigned_key");
            const expireTime = parseInt(localStorage.getItem("sph_user_expire") || "0");
            const currentTime = Date.now();

            // Si el usuario ya tiene una key activa y no han pasado las 10 horas, se la mostramos igual
            if (savedKey && expireTime && currentTime < expireTime) {
                document.getElementById("assignedKey").innerText = savedKey;
                return;
            }

            // Obtenemos las keys que ya se han repartido
            let usadas = JSON.parse(localStorage.getItem("sph_keys_usadas") || "[]");

            // Filtramos para obtener únicamente las que todavía están libres
            let disponibles = masterKeys.filter(k => !usadas.includes(k));

            let selectedKey = "";

            if (disponibles.length > 0) {
                // Escoge una key completamente al azar de las disponibles
                const randomIndex = Math.floor(Math.random() * disponibles.length);
                selectedKey = disponibles[randomIndex];
            } else {
                // Si se llegaran a agotar, el sistema autogenera una única de respaldo desordenada
                selectedKey = "KEY-" + Math.random().toString(36).substring(2, 6).toUpperCase() + "-" + Math.floor(Math.random() * 8999 + 1000);
            }

            // Registramos la key como usada y establecemos su duración exacta de 10 horas
            usadas.push(selectedKey);
            localStorage.setItem("sph_keys_usadas", JSON.stringify(usadas));
            localStorage.setItem("sph_user_assigned_key", selectedKey);
            localStorage.setItem("sph_user_expire", currentTime + 36000000); // 10 horas

            // Mostramos la key en la pantalla inmediatamente
            document.getElementById("assignedKey").innerText = selectedKey;
        }

        function copiarKey() {
            const keyText = document.getElementById("assignedKey").innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                alert("¡Key copiada al portapapeles con éxito!");
            });
        }
