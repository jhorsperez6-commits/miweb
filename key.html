<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serve Pene Hub - Tu Key Generada</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #0b0c10, #1f2833); color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background-color: #121316; border: 1px solid #2d3142; padding: 35px 25px; border-radius: 16px; width: 100%; max-width: 440px; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); }
        h1 { color: #00bfff; font-size: 24px; margin-bottom: 5px; font-weight: 700; letter-spacing: 1px; }
        .subtitle { color: #8c91a0; font-size: 13px; margin-bottom: 25px; }
        .key-box { background-color: #1a1c23; border: 1px dashed #00bfff; padding: 20px; border-radius: 10px; margin-top: 15px; }
        .key-title { font-size: 13px; color: #00ff88; margin-bottom: 8px; font-weight: bold; }
        .key-text { color: #ffffff; font-family: monospace; font-size: 16px; font-weight: bold; margin-bottom: 15px; word-break: break-all; background: #0b0c10; padding: 10px; border-radius: 6px; border: 1px solid #333; }
        .btn { background: linear-gradient(135deg, #00bfff, #0077ff); color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block; transition: transform 0.2s; box-shadow: 0 4px 15px rgba(0, 191, 255, 0.3); text-align: center; }
        .btn:active { transform: scale(0.98); }
        .btn-copy { background: linear-gradient(135deg, #00cc66, #00994d); box-shadow: 0 4px 15px rgba(0, 204, 102, 0.3); }
    </style>
</head>
<body>
    <div class="card">
        <h1>SERVE PENE HUB</h1>
        <div class="subtitle">¡Anuncios Completados con Éxito!</div>
        <div id="contentBox">
            <div class="key-title">Tu Key Única Asignada:</div>
            <div class="key-box">
                <div class="key-text" id="assignedKey">Generando key segura...</div>
                <button class="btn btn-copy" onclick="copiarKey()">Copiar Key al Portapapeles</button>
            </div>
            <div style="margin-top: 20px; font-size: 12px; color: #8c91a0;">
                Esta key es única para ti y tiene una vigencia de <b>10 horas</b>.
            </div>
        </div>
    </div>

    <script>
        // Lista masiva con keys totalmente diferentes, desordenadas y sin patrones obvios
        const masterKeys = [
            "X9mK-22pL-88qW", "Z7vB-44nT-11kM", "Q3wX-99aZ-55pL", "H8jN-33kK-77vC", "F2dL-66xX-44bN",
            "M5kP-11zZ-99wW", "T1qW-88mN-22bB", "K4xX-55vV-33cC", "L9zZ-22pP-66xX", "P6bB-77qQ-11mM",
            "V3nX-44kK-88zZ", "R8mN-11wW-55pP", "J2vV-99xX-77bB", "C7kK-33zZ-22qQ", "N5pP-66mM-44wW",
            "G1wW-55bB-88xX", "D4qQ-22vV-99kK", "B9zZ-77mM-11pP", "S6xX-11kK-33wW", "W2mN-88pP-55bB",
            "AX7-992-BNC",     "ZX9-411-KLP",     "QWE-778-ZZX",     "POI-332-MNB",     "LKJ-556-VCF",
            "HGF-884-XDS",     "REW-119-QAZ",     "TYU-663-WSX",     "JKL-225-EDC",     "VBN-447-RFV",
            "MKI-998-TGB",     "OIK-774-YHN",     "UYT-331-UJM",     "TRE-552-IKL",     "WQA-116-OPU",
            "ZXC-669-YTR",     "ASD-883-REW",     "FGH-227-QWE",     "JKL-441-BNM",     "BNM-995-VCX",
            "ALPHA-77-Z",      "BETA-33-X",       "GAMMA-88-C",      "DELTA-11-V",      "OMEGA-55-B",
            "VIP-99-K-44",     "GOD-22-L-77",     "PRO-66-M-11",     "LUA-44-N-88",     "HUB-33-P-22",
            "Xtreme-991-Z",    "Ultra-442-X",     "Master-773-C",    "Elite-114-V",     "GodMode-555-B",
            "FastKey-886-N",   "Secure-227-M",    "Random-668-Q",    "Token-339-W",     "Access-110-E"
        ];

        window.onload = function() {
            const savedKey = localStorage.getItem("sph_user_assigned_key");
            const expireTime = parseInt(localStorage.getItem("sph_user_expire") || "0");
            const currentTime = Date.now();

            // Si el usuario ya tiene una key activa y no han pasado las 10 horas, se la mostramos igual
            if (savedKey && expireTime && currentTime < expireTime) {
                document.getElementById("assignedKey").innerText = savedKey;
                return;
            }

            // Obtenemos las keys que ya se han repartido en este navegador
            let usadas = JSON.parse(localStorage.getItem("sph_keys_usadas") || "[]");

            // Filtramos para obtener únicamente las que todavía están libres
            let disponibles = masterKeys.filter(k => !usadas.includes(k));

            let selectedKey = "";

            if (disponibles.length > 0) {
                // Escoge una key al azar de las disponibles
                const randomIndex = Math.floor(Math.random() * disponibles.length);
                selectedKey = disponibles[randomIndex];
            } else {
                // Si se llegaran a usar todas, el sistema autogenera una de respaldo única mezclada
                selectedKey = "KEY-" + Math.random().toString(36).substring(2, 6).toUpperCase() + "-" + Math.floor(Math.random() * 8999 + 1000);
            }

            // Registramos la key como usada y establecemos su duración de 10 horas (36,000,000 ms)
            usadas.push(selectedKey);
            localStorage.setItem("sph_keys_usadas", JSON.stringify(usadas));
            localStorage.setItem("sph_user_assigned_key", selectedKey);
            localStorage.setItem("sph_user_expire", currentTime + 36000000);

            // Mostramos la key resultante en la pantalla
            document.getElementById("assignedKey").innerText = selectedKey;
        }

        function copiarKey() {
            const keyText = document.getElementById("assignedKey").innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                alert("¡Key copiada al portapapeles con éxito! Ya puedes usarla.");
            });
        }
    </script>
</body>
</html>
