<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serve Pene Hub - Key System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #0b0c10, #1f2833); color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background-color: #121316; border: 1px solid #2d3142; padding: 35px 25px; border-radius: 16px; width: 100%; max-width: 440px; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); }
        h1 { color: #00bfff; font-size: 24px; margin-bottom: 5px; font-weight: 700; letter-spacing: 1px; }
        .subtitle { color: #8c91a0; font-size: 13px; margin-bottom: 25px; }
        
        .step-container { margin-bottom: 20px; }
        .step-title { font-size: 14px; color: #00ff88; margin-bottom: 8px; font-weight: bold; }
        
        .btn { background: linear-gradient(135deg, #00bfff, #0077ff); color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block; margin-bottom: 10px; transition: transform 0.2s, opacity 0.2s; box-shadow: 0 4px 15px rgba(0, 191, 255, 0.3); text-align: center; }
        .btn:active { transform: scale(0.98); }
        .btn-check { background: linear-gradient(135deg, #00cc66, #00994d); box-shadow: 0 4px 15px rgba(0, 204, 102, 0.3); display: none; }
        
        .key-box { background-color: #1a1c23; border: 1px dashed #00bfff; padding: 15px; border-radius: 10px; margin-top: 20px; display: none; }
        .key-title { font-size: 12px; color: #8c91a0; margin-bottom: 8px; }
        .key-text { color: #00ff88; font-family: monospace; font-size: 15px; font-weight: bold; margin-bottom: 12px; word-break: break-all; }
        .btn-copy { background: #232733; color: #00ff88; border: 1px solid #00ff88; padding: 10px; font-size: 13px; box-shadow: none; }
        
        .ads-banner { background: #181b22; border: 1px dashed #444; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 12px; color: #aaa; }
    </style>
</head>
<body>

    <div class="card">
        <h1>SERVE PENE HUB</h1>
        <div class="subtitle">Sistema de Key Oficial</div>

        <div class="ads-banner">
            ⚠️ <b>Paso único:</b> Haz clic en el botón de abajo para ir al enlace de publicidad, complétalo y regresa aquí para reclamar tu key aleatoria.
        </div>

        <!-- SECCIÓN DEL ENLACE DE PUBLICIDAD -->
        <div id="sectionStep" class="step-container">
            <div class="step-title">Paso Obligatorio: Obtener Acceso</div>
            <!-- Tu enlace directo de Linkvertise integrado aquí -->
            <a href="https://direct-link.net/10206472/nwcz69c35Q6x" target="_blank" class="btn" onclick="irAlAnuncio()">IR A LA PUBLICIDAD</a>
            <button id="checkBtn" class="btn btn-check" onclick="verificarYGenerar()">YA COMPLETÉ EL ANUNCIO (OBTENER KEY)</button>
        </div>

        <!-- CONTENEDOR DE LA KEY RANDOM FINAL -->
        <div id="keyContainer" class="key-box">
            <div class="key-title">¡Key generada al azar con éxito!</div>
            <div class="key-text" id="generatedKey">SPH-XXXX-XXXX</div>
            <button class="btn btn-copy" onclick="copiarKey()">Copiar Key al Portapapeles</button>
        </div>
    </div>

    <script>
        function irAlAnuncio() {
            // Guardamos que el usuario hizo clic en el enlace publicitario
            localStorage.setItem("sph_clicked_ad", "true");
            
            // Hacemos aparecer el botón de verificación después de 2 segundos para darle tiempo de irse
            setTimeout(() => {
                document.getElementById("checkBtn").style.display = "block";
            }, 2000);
        }

        function verificarYGenerar() {
            const clickedAd = localStorage.getItem("sph_clicked_ad");

            if (!clickedAd) {
                alert("¡Primero debes hacer clic en el botón de publicidad!");
                return;
            }

            // Generamos una key completamente random (aleatoria) con letras y números
            const nuevaKey = generarKeyRandom();
            
            // Guardamos la key para que no se pierda si recarga
            localStorage.setItem("sph_random_key", nuevaKey);
            localStorage.setItem("sph_expire", Date.now() + 43200000); // Dura 12 horas

            mostrarKeyFinal(nuevaKey);
        }

        function generarKeyRandom() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let key = "SPH-RANDOM-";
            for (let i = 0; i < 8; i++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return key;
        }

        window.onload = function() {
            const savedKey = localStorage.getItem("sph_random_key");
            const expireTime = parseInt(localStorage.getItem("sph_expire") || "0");
            const clickedAd = localStorage.getItem("sph_clicked_ad");

            // Si ya tiene una key activa y no ha expirado, se la mostramos directo
            if (savedKey && expireTime && Date.now() < expireTime) {
                mostrarKeyFinal(savedKey);
                return;
            }

            // Si ya había dado clic antes, dejamos visible el botón de verificar
            if (clickedAd) {
                document.getElementById("checkBtn").style.display = "block";
            }
        }

        function mostrarKeyFinal(key) {
            document.getElementById("sectionStep").style.display = "none";
            document.getElementById("keyContainer").style.display = "block";
            document.getElementById("generatedKey").innerText = key;
        }

        function copiarKey() {
            const keyText = document.getElementById("generatedKey").innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                alert("¡Key copiada al portapapeles! Ya puedes usarla.");
            });
        }
    </script>

</body>
</html>
