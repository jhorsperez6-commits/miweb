<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serve Pene Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: #050508;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #0c0c14;
            border: 1px solid #1a1a2e;
            border-radius: 22px;
            width: 100%;
            max-width: 400px;
            padding: 40px 26px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #00e5ff, #00ff88);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 800;
            color: #000;
            margin: 0 auto 20px;
        }

        h1 {
            font-size: 24px;
            color: #00e5ff;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #666;
            font-size: 13px;
            margin-bottom: 30px;
        }

        #inicio {
            display: block;
        }

        .btn-principal {
            background: linear-gradient(135deg, #00ff88, #00e676);
            color: #000;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        #pasos {
            display: none;
        }

        .paso {
            background: #12121c;
            border: 1px solid #222;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .paso.bloqueado {
            opacity: 0.45;
        }

        .paso.completado {
            border-color: #00ff88;
        }

        .paso-info {
            text-align: left;
            flex: 1;
        }

        .paso-info strong {
            display: block;
            font-size: 15px;
            margin-bottom: 3px;
        }

        .paso-info span {
            font-size: 12px;
            color: #777;
        }

        .btn-paso {
            background: #00bfff;
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-paso:disabled {
            background: #333;
            color: #777;
            cursor: not-allowed;
        }

        .check {
            color: #00ff88;
            font-size: 22px;
            display: none;
        }

        .paso.completado .check {
            display: block;
        }

        .paso.completado .btn-paso {
            display: none;
        }

        #btnGenerar {
            display: none;
            margin-top: 10px;
            background: linear-gradient(135deg, #00ff88, #00e676);
            color: #000;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        .loader {
            width: 18px;
            height: 18px;
            border: 2px solid #000;
            border-top: 2px solid transparent;
            border-radius: 50%;
            display: inline-block;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">SP</div>
        <h1>SERVE PENE HUB</h1>
        <div class="subtitle">Sistema Oficial de Keys</div>

        <!-- PANTALLA INICIO -->
        <div id="inicio">
            <button class="btn-principal" onclick="mostrarPasos()">
                Hacer los pasos
            </button>
        </div>

        <!-- PANTALLA DE PASOS -->
        <div id="pasos">
            <!-- PASO 1 - YouTube -->
            <div class="paso" id="paso1">
                <div class="paso-info">
                    <strong>YouTube</strong>
                    <span>Visitar el canal</span>
                </div>
                <button class="btn-paso" id="btn1" onclick="completarPaso(1, 'https://youtube.com/@jhorsperez-y3x')">Ir</button>
                <div class="check">✓</div>
            </div>

            <!-- PASO 2 - TikTok -->
            <div class="paso bloqueado" id="paso2">
                <div class="paso-info">
                    <strong>TikTok</strong>
                    <span>Seguir la cuenta</span>
                </div>
                <button class="btn-paso" id="btn2" onclick="completarPaso(2, 'https://www.tiktok.com/@alex12l0')" disabled>Bloqueado</button>
                <div class="check">✓</div>
            </div>

            <!-- PASO 3 - Discord -->
            <div class="paso bloqueado" id="paso3">
                <div class="paso-info">
                    <strong>Discord</strong>
                    <span>Unirse al servidor</span>
                </div>
                <button class="btn-paso" id="btn3" onclick="completarPaso(3, 'https://discord.gg/p5fyg6vX5')" disabled>Bloqueado</button>
                <div class="check">✓</div>
            </div>

            <!-- BOTÓN FINAL -->
            <button id="btnGenerar" onclick="irAWorkInk()">
                Generar Key
            </button>
        </div>
    </div>

    <script>
        let pasosCompletados = 0;

        function mostrarPasos() {
            document.getElementById("inicio").style.display = "none";
            document.getElementById("pasos").style.display = "block";
        }

        function completarPaso(numero, link) {
            const btn = document.getElementById("btn" + numero);
            const paso = document.getElementById("paso" + numero);

            // Abrir el link
            window.open(link, "_blank");

            // Poner loader
            btn.innerHTML = '<span class="loader"></span> Espere...';
            btn.disabled = true;

            // Simular carga de 5 segundos
            setTimeout(() => {
                paso.classList.remove("bloqueado");
                paso.classList.add("completado");
                pasosCompletados++;

                // Desbloquear el siguiente
                if (numero === 1) {
                    document.getElementById("paso2").classList.remove("bloqueado");
                    const btn2 = document.getElementById("btn2");
                    btn2.disabled = false;
                    btn2.innerText = "Ir";
                }

                if (numero === 2) {
                    document.getElementById("paso3").classList.remove("bloqueado");
                    const btn3 = document.getElementById("btn3");
                    btn3.disabled = false;
                    btn3.innerText = "Ir";
                }

                // Si ya completó los 3
                if (pasosCompletados === 3) {
                    document.getElementById("btnGenerar").style.display = "block";
                }
            }, 5000);
        }

        function irAWorkInk() {
            window.location.href = "https://work.ink/34J6/key-sistem";
        }
    </script>
</body>
</html>
